name: Build Release Binaries

# A push to main lets ccv tag a new version from the conventional commits
# since the last tag. When it does, the same run builds the binaries and
# publishes them as that tag's GitHub release: a tag pushed with the
# workflow's own token would not start another workflow.
#
# Run it by hand with an existing tag to build and publish (or republish)
# that tag's release.

on:
  push:
    branches:
      - "main"
    paths:
      - "**"
      - "!docs/**"
  workflow_dispatch:
    inputs:
      tag:
        description: An existing tag to build and publish, e.g. v0.3.0
        required: true

permissions:
  contents: read

jobs:
  release-tag:
    if: github.event_name == 'push'
    permissions:
      # create tag
      contents: write
    runs-on: ubuntu-latest
    outputs:
      new-tag: ${{ steps.ccv.outputs.new-tag }}
      new-tag-version: ${{ steps.ccv.outputs.new-tag-version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Bump tag if necessary
        id: ccv
        uses: smlx/ccv@7318e2f25a52dcd550e75384b84983973251a1f8 # v0.10.0

  build:
    needs: release-tag
    if: >-
      !cancelled() && (github.event_name == 'workflow_dispatch'
      || needs.release-tag.outputs.new-tag == 'true')
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-tag.outputs.new-tag-version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux binaries are static (musl), so they run on any distribution.
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
    steps:
      - name: Check the tag
        run: |
          tag="v${TAG#v}"
          case $tag in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::'$TAG' is not a version tag like v1.2.3"; exit 1 ;;
          esac
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "VERSION=${tag#v}" >> "$GITHUB_ENV"

      - name: Checkout the tag
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.TAG }}

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add "${{ matrix.target }}"

      - name: Install musl tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Stamp the version from the tag
        # Cargo.toml's version is not bumped in commits; the tag is the version.
        run: |
          perl -pi -e 'if (!$done && s/^version = "[^"]*"/version = "$ENV{VERSION}"/) { $done = 1 }' Cargo.toml
          grep -m1 '^version = ' Cargo.toml
          cargo update --workspace

      - name: Build
        run: cargo build --release --locked --target "${{ matrix.target }}"

      - name: Test the binary
        run: |
          bin="target/${{ matrix.target }}/release/pathrc"
          test "$("$bin" --version)" = "pathrc $VERSION"
          eval "$("$bin" init sh)"

      - name: Package
        run: |
          mkdir dist
          archive="pathrc-${{ matrix.target }}.tar.gz"
          tar -czf "dist/$archive" -C "target/${{ matrix.target }}/release" pathrc \
            -C "$GITHUB_WORKSPACE" LICENSE README.md
          (cd dist && shasum -a 256 "$archive" > "$archive.sha256")
          cat "dist/$archive.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: pathrc-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [release-tag, build]
    if: >-
      !cancelled() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      # create the release and upload its files
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-tag.outputs.new-tag-version }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish the release
        run: |
          tag="v${TAG#v}"
          ls -l dist
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" dist/* --verify-tag --generate-notes \
              --title "$tag" --repo "$GITHUB_REPOSITORY"
          fi
