name: PR Validation

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
jobs:
  commit-check:
    runs-on: ubuntu-latest
    permissions: # use permissions because use of pr-comments

      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Required for merge-base checks
      - uses: ./.github/actions/conventional-check
        # with
      # - uses: commit-check/commit-check-action@v2
        # with:
        #   message: true
        #   branch: true
        #   author-name: false
        #   author-email: false
        #   job-summary: true
        #   pr-comments: ${{ github.event_name == 'pull_request' }}
  test:
    needs: commit-check
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - run: rustup toolchain install stable --profile minimal
      - name: Unit and integration tests
        run: cargo test --locked
      - name: Install zsh and fish
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh fish
      - name: End-to-end shell tests
        run: cargo build --locked && bash test/test.sh
  build:
    needs: commit-check
    # name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-intel
            runner: macos-15-intel
            target: x86_64-apple-darwin
            archive_suffix: macos-intel

          - name: macos-m1
            runner: macos-15
            target: aarch64-apple-darwin
            archive_suffix: macos-m1

          - name: macos-m2
            runner: macos-15
            target: aarch64-apple-darwin
            archive_suffix: macos-m2

          - name: linux-amd64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            archive_suffix: linux-amd64

          - name: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive_suffix: linux-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - run: rustup toolchain install stable --profile minimal
      - uses: michaelklishin/rust-build-package-release-action@v2
        id: build
        with:
          command: release
          target: ${{ matrix.target }}
          archive: "true"
          locked: "true"
          checksum: "sha256,sha512"
      - name: Test the built binary
        run: |
          echo "Testing the built binary for ${{ matrix.target }}"
          export PATH="$PWD/target/${{ matrix.target }}/release:$PATH"
          pathrc --version
          eval "$(pathrc init sh)"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/pathrc
            target/${{ matrix.target }}/release/pathrc.tar.gz
            target/${{ matrix.target }}/release/pathrc.tar.gz.sha256
            target/${{ matrix.target }}/release/pathrc.tar.gz.sha512
