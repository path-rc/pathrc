# pathrc for fish. On every directory change, `pathrc collate` prints code
# that leaves the levels (files) no longer in scope and enters the new ones.
# Entering saves each name in a slot here before changing it; leaving
# restores it. pathrc only names the slots: values, secrets included, never
# pass through it. Locals are __pathrc_ prefixed so a setting can't shadow
# them.
set -g __pathrc_state ''
function __pathrc_vsave --description 'pathrc: save a variable (slot name)'
  set -l __pathrc_n $argv[2]
  if set -q $__pathrc_n
    set -g __pathrc_s_$argv[1] $$__pathrc_n
  else
    set -e __pathrc_s_$argv[1]
  end
end
function __pathrc_vrestore --description 'pathrc: restore a variable (slot name was-exported)'
  set -l __pathrc_n $argv[2]
  set -l __pathrc_saved __pathrc_s_$argv[1]
  set -e $__pathrc_n
  if set -q $__pathrc_saved
    if test "$argv[3]" = 1
      set -gx $__pathrc_n $$__pathrc_saved
    else
      set -g $__pathrc_n $$__pathrc_saved
    end
  end
  set -e $__pathrc_saved
end
function __pathrc_asave --description 'pathrc: save an alias (slot name)'
  if functions -q $argv[2]
    set -g __pathrc_a_$argv[1] (functions $argv[2] | string collect)
  else
    set -e __pathrc_a_$argv[1]
  end
end
function __pathrc_arestore --description 'pathrc: restore an alias (slot name)'
  set -l __pathrc_saved __pathrc_a_$argv[1]
  functions -e $argv[2]
  if set -q $__pathrc_saved
    printf '%s\n' $$__pathrc_saved | source
  end
  set -e $__pathrc_saved
end
function __pathrc_collate
  PATHRC_STATE=$__pathrc_state pathrc collate | source
end
function __pathrc_on_pwd --on-variable PWD --description 'pathrc: apply settings after a directory change'
  __pathrc_collate
end
__pathrc_collate
