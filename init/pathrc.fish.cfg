# pathrc for fish: files load on entering a directory but are not unloaded
# on leaving it.
set -g __pathrc_loaded ''
function __pathrc_on_pwd --on-variable PWD --description 'Evaluate pathrc after a directory change'
  PATHRC_LOADED=$__pathrc_loaded pathrc collate | source
end
PATHRC_LOADED=$__pathrc_loaded pathrc collate | source
