# pathrc for bash. On every cd, `pathrc collate` prints code that leaves the
# levels (files) no longer in scope and enters the new ones. Entering saves
# each name in a slot here before changing it; leaving restores it. pathrc
# only names the slots: values, secrets included, never pass through it.
# No associative arrays, no `declare -g`: this runs on macOS's bash 3.2 too.
__pathrc_state=
__pathrc_vsave() { # slot name
  eval "if [ -n \"\${$2+x}\" ]; then __pathrc_s_$1=\$$2; else unset __pathrc_s_$1; fi"
}
__pathrc_vrestore() { # slot name was-exported
  unset "$2"
  eval "if [ -n \"\${__pathrc_s_$1+x}\" ]; then $2=\$__pathrc_s_$1; [ \"\$3\" = 1 ] && export $2; fi"
  unset "__pathrc_s_$1"
}
if [ "${BASH_VERSINFO[0]}" -ge 4 ]; then
  __pathrc_asave() { # slot name
    if [ -n "${BASH_ALIASES[$2]+x}" ]; then
      eval "__pathrc_a_$1=\${BASH_ALIASES[\$2]}"
    else
      unset "__pathrc_a_$1"
    fi
  }
  __pathrc_arestore() { # slot name
    unalias "$2" 2> /dev/null
    eval "if [ -n \"\${__pathrc_a_$1+x}\" ]; then BASH_ALIASES[\$2]=\$__pathrc_a_$1; fi"
    unset "__pathrc_a_$1"
  }
else
  # bash 3.2 has no BASH_ALIASES: keep `alias NAME`'s output and replay it.
  __pathrc_asave() { # slot name
    if __pathrc_t=$(alias "$2" 2> /dev/null); then
      eval "__pathrc_a_$1=\$__pathrc_t"
    else
      unset "__pathrc_a_$1"
    fi
    unset __pathrc_t
  }
  __pathrc_arestore() { # slot name
    unalias "$2" 2> /dev/null
    eval "if [ -n \"\${__pathrc_a_$1+x}\" ]; then eval \"\$__pathrc_a_$1\"; fi"
    unset "__pathrc_a_$1"
  }
fi
__pathrc_collate() {
  eval "$(PATHRC_STATE=$__pathrc_state pathrc collate)"
}
function cd {
  builtin cd "$@" && __pathrc_collate
}
__pathrc_collate
