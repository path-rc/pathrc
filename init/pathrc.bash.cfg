# pathrc for bash. Each file is loaded by __pathrc_load, which snapshots the
# shell before and after it so `pathrc _undo` can work out how to take it
# back out when you leave its directory. No associative arrays, no
# `declare -g`: this runs on macOS's bash 3.2 too.
__pathrc_loaded=
__pathrc_dump() {
  declare -p
  echo "$1aliases"
  alias -p
  echo "$1functions"
  declare -f
}
__pathrc_load() { # index, loaded state after it, code
  __pathrc_index=$1 __pathrc_state=$2 __pathrc_code=$3
  set --
  __pathrc_mark="#__pathrc_${RANDOM}${RANDOM}${RANDOM}_"
  __pathrc_before=$(__pathrc_dump "$__pathrc_mark")
  eval "$__pathrc_code"
  unset __pathrc_code
  __pathrc_undo=$( { printf '%s\n' "$__pathrc_before" "${__pathrc_mark}after"; unset __pathrc_before; __pathrc_dump "$__pathrc_mark"; } | pathrc _undo bash "$__pathrc_mark")
  eval "__pathrc_undo_$__pathrc_index=\$__pathrc_undo"
  __pathrc_loaded=$__pathrc_state
  unset __pathrc_before __pathrc_undo __pathrc_index __pathrc_state __pathrc_mark
}
__pathrc_unload() { # index, loaded state after it
  eval "__pathrc_undo=\${__pathrc_undo_$1-}"
  unset "__pathrc_undo_$1"
  __pathrc_loaded=$2
  eval "$__pathrc_undo"
  unset __pathrc_undo
}
__pathrc_collate() {
  eval "$(PATHRC_LOADED=$__pathrc_loaded pathrc collate)"
}
function cd {
  builtin cd "$@" && __pathrc_collate
}
__pathrc_collate
