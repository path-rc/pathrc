# pathrc for zsh. On every cd, `pathrc collate` prints code that leaves the
# levels (files) no longer in scope and enters the new ones. Entering saves
# each name in a slot here before changing it; leaving restores it. pathrc
# only names the slots: values, secrets included, never pass through it.
__pathrc_state=
__pathrc_vsave() { # slot name
  if (( ${+parameters[$2]} )); then
    typeset -g "__pathrc_s_$1=${(P)2}"
  else
    unset "__pathrc_s_$1"
  fi
}
__pathrc_vrestore() { # slot name was-exported
  unset "$2"
  if (( ${+parameters[__pathrc_s_$1]} )); then
    typeset -g "$2=${(P)${:-__pathrc_s_$1}}"
    [[ $3 == 1 ]] && export "$2"
  fi
  unset "__pathrc_s_$1"
}
__pathrc_asave() { # slot name
  if (( ${+aliases[$2]} )); then
    typeset -g "__pathrc_a_$1=${aliases[$2]}"
  else
    unset "__pathrc_a_$1"
  fi
}
__pathrc_arestore() { # slot name
  unalias "$2" 2> /dev/null
  if (( ${+parameters[__pathrc_a_$1]} )); then
    aliases[$2]=${(P)${:-__pathrc_a_$1}}
  fi
  unset "__pathrc_a_$1"
}
__pathrc_collate() {
  eval "$(PATHRC_STATE=$__pathrc_state pathrc collate)"
}
autoload -U add-zsh-hook
add-zsh-hook chpwd __pathrc_collate
__pathrc_collate
